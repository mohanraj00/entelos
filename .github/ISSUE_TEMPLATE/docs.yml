name: Docs problem
description: Report a step, link or statement in the docs that is wrong, missing or not clear.
title: "Docs: "
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Page and section
      description: The file and the section heading, for example README.md, "3. Run the demo".
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What the page says, what you did and what occurred. Write the commands and the error messages exactly. Remove user names, home paths and private data.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed change
      description: The text or the step that you want. Write "None" if you do not know.
