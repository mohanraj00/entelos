name: Full suite
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.6
      - name: Record toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/vdr-report"
          { uname -srm; grep PRETTY_NAME /etc/os-release; go version; python3 --version; git --version; } | tee "$RUNNER_TEMP/vdr-report/toolchain.txt"
      - name: Run the standalone verifier in a fresh work directory
        run: python3 -B verify.py --work "$RUNNER_TEMP/vdr-work"
      - name: Collect compact results
        if: always()
        run: |
          cd "$RUNNER_TEMP/vdr-work" 2>/dev/null || exit 0
          find . -maxdepth 2 \( -name results.json -o -name commands.json -o -name test-results.json -o -path './runs/*.json' \) -print0 \
            | xargs -0 -r cp --parents -t "$RUNNER_TEMP/vdr-report"
      - name: Upload results and failure logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-suite-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vdr-report
          retention-days: 14
          if-no-files-found: warn
