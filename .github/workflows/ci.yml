name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the changed paths
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="" ;;
          esac
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "No usable base: run all checks."; exit 0
          fi
          python3 -B tools/classify_change.py "$base" HEAD --github-output "$GITHUB_OUTPUT"
  shared-project:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate shared harness layout and source inventory
        run: python3 -B tools/check_project.py
  standalone:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.6
      - name: Record toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/vdr-report"
          {
            uname -srm
            if [ -r /etc/os-release ]; then grep PRETTY_NAME /etc/os-release; else sw_vers; fi
            go version; python3 --version; git --version
          } | tee "$RUNNER_TEMP/vdr-report/toolchain.txt"
      - name: Run the standalone verifier in a fresh work directory
        run: python3 -B verify.py --work "$RUNNER_TEMP/vdr-work"
      - name: Collect compact results
        if: always()
        # The macOS cp has no --parents option. This loop works with GNU and BSD tools.
        run: |
          cd "$RUNNER_TEMP/vdr-work" 2>/dev/null || exit 0
          find . -maxdepth 2 \( -name results.json -o -name commands.json -o -name test-results.json -o -path './runs/*.json' \) -print \
            | while IFS= read -r f; do
                mkdir -p "$RUNNER_TEMP/vdr-report/$(dirname "$f")"
                cp "$f" "$RUNNER_TEMP/vdr-report/$f"
              done
      - name: Upload results and failure logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-suite-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vdr-report
          retention-days: 14
          if-no-files-found: warn
  ci-ok:
    needs: [changes, shared-project, standalone]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every needed job to pass or be skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
