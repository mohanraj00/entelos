name: CI
# The ci-ok skeleton. Copy this file to .github/workflows/ci.yml of the project, then put the project jobs in it.
# Replace the SHA of the gates action with a full SHA of mohanraj00/.github on main.
# A docs-only PR skips the project jobs, and ci-ok still passes. The check job always runs.
# Do not use paths-ignore, because a required check can then stay pending.
on:
  pull_request:
  push:
    branches: [main]
permissions: {}
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      # The classify step reads .github/gates.json from the base branch, so a PR cannot mark its own change as docs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - id: classify
        uses: mohanraj00/.github/gates@b5d2b63f9bc6a61a17b1370d8e23cbee37008076 # main, 2026-11-11
        with:
          check: classify
  # The project check always runs.
  shared-project:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The stability pin reads the Go API with the Go parser.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
          cache: false
      - name: Run the project check and the Claude review tests
        run: make check
  # The parse of each workflow always runs. In a test, an invalid workflow passed the project check and both Codex reviews.
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # One exact version. The SHA-256 value is from the checksums file of the actionlint release.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          mkdir "$RUNNER_TEMP/actionlint"
          curl --fail --silent --show-error --location --proto '=https' --output "$RUNNER_TEMP/actionlint/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint/actionlint.tgz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/actionlint/actionlint.tgz" --directory "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: Parse each workflow
        run: actionlint .github/workflows/*.yml
  # The full suite runs only for a change that is not docs-only.
  standalone:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.14.6
      # Node runs the WebAssembly executor module for the executor vectors and WASM qualification.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Record toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/vdr-report"
          {
            uname -srm
            if [ -r /etc/os-release ]; then grep PRETTY_NAME /etc/os-release; else sw_vers; fi
            go version; python3 --version; node --version; git --version
            if command -v google-chrome >/dev/null; then google-chrome --version; else "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version; fi
          } | tee "$RUNNER_TEMP/vdr-report/toolchain.txt"
      - name: Run the standalone verifier in a fresh work directory
        # The runner image has Chrome. The browser checks load only local pages from verify.py.
        # The Ubuntu runner can refuse the user namespaces of the Chromium sandbox, so that run turns the sandbox off.
        env:
          ENTELOS_BROWSER_NO_SANDBOX: ${{ startsWith(matrix.os, 'ubuntu') && '1' || '0' }}
        run: python3 -B verify.py --work "$RUNNER_TEMP/vdr-work"
      - name: Collect compact results
        if: always()
        # The macOS cp has no --parents option. This loop works with GNU and BSD tools.
        run: |
          cd "$RUNNER_TEMP/vdr-work" 2>/dev/null || exit 0
          find . -maxdepth 2 \( -name results.json -o -name commands.json -o -name test-results.json -o -path './runs/*.json' \) -print \
            | while IFS= read -r f; do
                mkdir -p "$RUNNER_TEMP/vdr-report/$(dirname "$f")"
                cp "$f" "$RUNNER_TEMP/vdr-report/$f"
              done
      - name: Upload results and failure logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-suite-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vdr-report
          retention-days: 14
          if-no-files-found: warn
  # The required check. Add each project job to needs. A skipped job passes. A failed or cancelled job fails.
  ci-ok:
    needs: [changes, shared-project, actionlint, standalone]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Collect the project jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 -B -I -c '
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          bad = sorted(k for k, v in needs.items() if v["result"] not in ("success", "skipped"))
          if needs.get("changes", {}).get("result") != "success":
              bad = sorted(set(bad) | {"changes"})
          print("\n".join("%s: %s" % (k, v["result"]) for k, v in sorted(needs.items())))
          sys.exit("Failed jobs: " + ", ".join(bad) if bad else 0)
          '
